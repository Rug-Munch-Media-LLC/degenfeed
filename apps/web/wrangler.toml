# DegenFeed Web Client — Cloudflare Pages
# Uses @cloudflare/next-on-pages to build Next.js for the edge.
# Build output goes to .vercel/output/static (next-on-pages default).

name = "degenfeed"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[env.production]
vars = { API_BASE = "https://degenfeed.xyz/api" }

[env.preview]
vars = { API_BASE = "https://degenfeed.xyz/api" }
