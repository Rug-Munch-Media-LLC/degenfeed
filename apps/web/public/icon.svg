  </g>
  <text x="256" y="252" text-anchor="middle" fill="#00ff41" font-family="monospace" font-size="56" font-weight="bold" filter="url(#glow)">#</text>
  <g stroke="#00ff41" stroke-width="4" opacity="0.7" filter="url(#glow)">
