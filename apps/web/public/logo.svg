<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="df-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00cc34"/>
      <stop offset="100%" stop-color="#009928"/>
    </linearGradient>
    <linearGradient id="df-grad-dim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00cc34" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Glow behind text -->
  <rect x="5" y="8" width="190" height="44" rx="8" fill="url(#df-grad-dim)"/>
  <!-- Accent circle -->
  <circle cx="178" cy="30" r="16" fill="none" stroke="url(#df-grad)" stroke-width="2"/>
  <circle cx="178" cy="30" r="6" fill="url(#df-grad)"/>
  <!-- DGNF Wordmark -->
  <text x="18" y="42" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="800" font-size="32" fill="url(#df-grad)" letter-spacing="2">DGNF</text>
  <!-- Small "DegenFeed" subtitle -->
  <text x="18" y="54" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="8" fill="#6b7280" letter-spacing="3">DEGENFEED</text>
</svg>
