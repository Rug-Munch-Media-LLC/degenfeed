packages:
- apps/*
- design
- docs
- packages/*
- workers/*
allowBuilds:
  '@biomejs/biome': true
  '@bundled-es-modules/glob': set this to true or false
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  style-dictionary: set this to true or false
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
- viem@2.55.1
overrides:
  ws: ^8.21.1
  undici: '>=6.27.0'
  valibot: ^1.2.0
  sharp: ^0.35.3
  postcss: ^8.5.22
