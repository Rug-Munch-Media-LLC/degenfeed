packages:
  - apps/*
  - design
  - docs
  - packages/*
  - workers/*
allowBuilds:
  '@biomejs/biome': true
  '@bundled-es-modules/glob': false
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  style-dictionary: false
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - viem@2.55.1
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - jsdom@30.0.1
  - miniflare@4.20260722.1
  - wrangler@4.115.0
overrides:
  # GHSA-vj5c-m527-mpff / GHSA-3gc7-fjrx-p6mg: bigint-buffer <=1.1.5 buffer overflow
  # NOTE: advisory says patched >=1.1.6 but it is NOT published yet (latest=1.1.5). Track upstream.
  # (transitive via @solana/web3.js -> creator-coin, bundled into the web app)
  bigint-buffer: ^1.1.5
  ws: ^8.21.1
  undici: '>=6.27.0'
  valibot: ^1.2.0
  sharp: ^0.35.3
  postcss: ^8.5.22
