packages:
  - apps/*
  - bridge
  - design
  - docs
  - packages/*
  - workers/*
allowBuilds:
  '@biomejs/biome': true
  '@bundled-es-modules/glob': false
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  core-js-pure: set this to true or false
  esbuild: true
  msw: set this to true or false
  protobufjs: true
  sharp: true
  style-dictionary: false
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true
  workerd: true
minimumReleaseAgeExclude:
  - viem@2.55.1
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - jsdom@30.0.1
  - miniflare@4.20260722.1
  - wrangler@4.115.0
overrides:
  # GHSA-vj5c-m527-mpff / GHSA-3gc7-fjrx-p6mg: bigint-buffer <=1.1.5 buffer overflow
  # NOTE: advisory says patched >=1.1.6 but it is NOT published yet (latest=1.1.5). Track upstream.
  # (transitive via @solana/web3.js -> creator-coin, bundled into the web app)
  bigint-buffer: ^1.1.5
  ws: ^8.21.1
  undici: '>=6.27.0'
  valibot: ^1.2.0
  sharp: ^0.35.3
  postcss: ^8.5.22

  # 2026-08-21 OSV hardening (migrated from package.json pnpm.overrides)
  "axios": "^1.12.0"
  "axios@0.31.1": "^1.12.0"
  "axios@1.7.7": "^1.12.0"
  "hono": "^4.12.34"
  "js-yaml": "^4.3.1"
  "nanoid": "^3.3.18"
  "qs": "^6.15.2"
  "tmp": "^0.2.6"
  "uuid": "^11.1.1"
  "brace-expansion": "^5.0.9"
  "cookie": "^0.7.0"
  "dompurify": "^3.4.13"
  "vite@5.4.21": "^6.4.3"
  "uuid@8.3.2": "^11.1.1"
  "uuid@9.0.1": "^11.1.1"

  # GHSA-67mh-4wv8-2f99 / GHSA-g7r4-m6w7-qqqr: esbuild dev-server vulnerabilities
  "esbuild@0.15.18": "^0.25.0"
  "esbuild@0.27.7": "^0.28.1"
