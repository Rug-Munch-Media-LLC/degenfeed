packages:
  - "apps/*"
  - "design"
  - "docs"
  - "packages/*"
  - "workers/*"

allowBuilds:
  '@biomejs/biome': true
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  blake-hash: true
  bufferutil: true
  esbuild: true
  protobufjs: true
  sharp: true
  tiny-secp256k1: true
  usb: true
  utf-8-validate: true
  workerd: true

minimumReleaseAgeExclude:
  - viem@2.55.1
