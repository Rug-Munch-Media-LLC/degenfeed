# DegenFeed Web — Docker Compose
# Build: docker compose build
# Start: docker compose up -d
# Stop:  docker compose down

services:
  web:
    image: degenfeed-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* values are inlined at BUILD time into client + server
      # bundles, so they MUST stay public same-origin URLs (https://degenfeed.xyz
      # → nginx → this container → self-hosted API). The self-hosted API target
      # is controlled at RUNTIME via WORKER_URL + API_PROXY_TARGET
      # (http://host.docker.internal:3101) — set those in the env file.
      args:
        NEXT_PUBLIC_ADMIN_WALLETS: "0x1e3ac01d0fdb976179790bdd02823196a92705c9"
        NEXT_PUBLIC_APP_URL: "https://app.degenfeed.xyz"
        NEXT_PUBLIC_API_BASE: "https://degenfeed.xyz"
        NEXT_PUBLIC_API_URL: "https://degenfeed.xyz"
        NEXT_PUBLIC_WS_URL: "wss://bridge.degenfeed.xyz/ws/realtime"
    container_name: degenfeed-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file: /path/to/degenfeed/.env
    networks:
      - rmi_network
      - degenfeed_default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    user: "1001:1001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  rmi_network:
    external: true
  degenfeed_default:
    external: true
