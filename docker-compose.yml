# DegenFeed Web — Docker Compose
# Build: docker compose build
# Start: docker compose up -d
# Stop:  docker compose down

services:
  web:
    image: degenfeed-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: degenfeed-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    env_file: /srv/degenfeed/.env
    networks:
      - rmi_network
      - degenfeed_default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    user: "1001:1001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  rmi_network:
    external: true
  degenfeed_default:
    external: true
