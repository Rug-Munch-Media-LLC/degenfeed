pre-commit:
  parallel: true
  commands:
    envsitter:
      run: envsitter scan --filePath .env.example
    gitleaks:
      run: gitleaks detect --verbose --redact --no-git
    biome:
      run: npx biome check --write {staged_files}
pre-push:
  parallel: true
  commands:
    mypy:
      run: mypy --strict .
      tags: [python]
    bandit:
      run: bandit -r .
      tags: [python]
    deptry:
      run: deptry .
      tags: [python]
    gitleaks-full:
      run: gitleaks detect --verbose --redact
commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
