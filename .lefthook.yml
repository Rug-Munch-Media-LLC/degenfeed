pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    biome:
      glob: "*.{js,ts,tsx,vue,json,css,md}"
      run: biome check --write {staged_files}
    oxlint:
      glob: "*.{js,ts,tsx,vue}"
      run: oxlint --deny-warnings {staged_files}

pre-push:
  commands:
    gitleaks-full:
      run: gitleaks detect --source . --no-git -v
    tsc:
      run: tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
