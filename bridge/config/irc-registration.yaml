# ── Matrix Appservice IRC Registration ──────────────────────────────────────
# Generated for matrix-appservice-irc bridge to Libera.Chat/OFTC.
# This file MUST be installed in Synapse's app_service_config_files list.
#
# Generated for: bridge.degenfeed.xyz / matrix.degenfeed.xyz

id: irc-bridge
as_token: "${IRC_AS_TOKEN}"       # Set via env or generated at deploy
hs_token: "${IRC_HS_TOKEN}"       # Set via env or generated at deploy

# Namespace configuration
namespaces:
  users:
    - exclusive: true
      regex: "@irc_.*:matrix\\.degenfeed\\.xyz"
  aliases:
    - exclusive: true
      regex: "#_irc_.*:matrix\\.degenfeed\\.xyz"
  rooms: []

# URL of the bridge service (Synapse will push events here)
url: "http://appservice-irc:8095"

# Bridge bot user
sender_localpart: "irc_bot"

# Rate limiting
rate_limited: false

# Protocol info
protocols:
  - "irc"
