# LiveKit Configuration — DegenFeed WebRTC SFU for Group Calls
# ============================================================
# See: https://docs.livekit.io/server/configuration

port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  port_range_start: 7882
  port_range_end: 7900
  use_external_ip: true
  stun_servers:
    - "stun:stun.l.google.com:19302"
    - "stun:stun1.l.google.com:19302"
  turn_servers:
    - "turn:turn.degenfeed.xyz:3478"
    - "turns:turn.degenfeed.xyz:5349"

logging:
  level: info
  json: false

redis:
  address: ""  # Standalone mode — no Redis needed for single server

room:
  max_participants: 50
  empty_timeout: 300  # 5 minutes
  max_metadata_size: 1024

turn:
  enabled: true
  domain: turn.degenfeed.xyz
  tls_port: 5349

keys:
  # Set via LIVEKIT_API_KEY and LIVEKIT_API_SECRET env vars
