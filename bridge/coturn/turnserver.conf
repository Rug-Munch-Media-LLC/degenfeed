# coturn TURN/STUN Server Configuration — DegenFeed WebRTC
# ========================================================
# See: https://github.com/coturn/coturn

# Server name
server-name=turn.degenfeed.xyz
realm=degenfeed.xyz

# Listening ports
listening-port=3478
tls-listening-port=5349

# UDP relay ports
min-port=49152
max-port=65535

# Fingerprint and fingerprint protocol
fingerprint
lt-cred-mech

# User credentials (set via TURN_USER env var: user:password)
# user=username:password

# STUN only mode (no TURN) when no relay is needed
# stun-only

# TURN relay address
external-ip=0.0.0.0

# Logging
verbose
no-stdout-log

# Security
no-multicast-peers
mobility
no-cli

# TLS settings
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/pkey.pem
