name: Preview Deploy

# Deploy PR builds to Cloudflare Pages preview environments and
# comment the preview URL on the PR. Also deploys the worker to
# a preview environment for API testing.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  preview-api:
    name: Preview Worker API
    runs-on: ubuntu-latest
    environment:
      name: preview-api
      url: ${{ steps.deploy-api.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @degenfeed/api-worker typecheck

      - name: Test
        run: pnpm --filter @degenfeed/api-worker test

      - name: Build worker
        run: pnpm --filter @degenfeed/api-worker build

      - name: Deploy worker (preview)
        id: deploy-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --env preview

  preview-web:
    name: Preview Web App
    runs-on: ubuntu-latest
    needs: [preview-api]
    environment:
      name: preview-web
      url: ${{ steps.deploy-web.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app (Cloudflare Pages)
        run: pnpm --filter degenfeed pages:build

      - name: Deploy to Cloudflare Pages (preview)
        id: deploy-web
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy .vercel/output/static --project-name degenfeed --branch ${{ github.head_ref }}

  preview-healthcheck:
    name: Preview Health Check
    runs-on: ubuntu-latest
    needs: [preview-web]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check API
        run: |
          echo "=== Preview API health ==="
          PREVIEW_API_URL="https://degenfeed-api-preview.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          curl -sf --max-time 15 "${PREVIEW_API_URL}/api/health" || echo "WARN: API health check failed (may still be provisioning)"

      - name: Health check web app
        run: |
          echo "=== Preview Web health ==="
          # Pages preview URL format: https://<branch>.<project>.pages.dev
          BRANCH_SLUG="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH_SLUG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          PREVIEW_WEB_URL="https://${SANITIZED}.degenfeed.pages.dev"
          curl -sf --max-time 15 "${PREVIEW_WEB_URL}/" | grep -q "DegenFeed" && echo "PASS: Web preview responds" || echo "WARN: Web preview health check failed"

  preview-comment:
    name: Comment Preview URL
    runs-on: ubuntu-latest
    needs: [preview-web, preview-healthcheck]
    if: success() || failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const BRANCH_SLUG = process.env.BRANCH_SLUG || '${{ github.head_ref }}'
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-');

            const PREVIEW_WEB_URL = `https://${BRANCH_SLUG}.degenfeed.pages.dev`;
            const PREVIEW_API_URL = `https://degenfeed-api-preview.${CLOUDFLARE_ACCOUNT_ID}.workers.dev`;

            // Find any existing comment from this bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('🚀 Preview Deploy')
            );

            const body = [
              '## 🚀 Preview Deploy',
              '',
              '| Environment | URL | Status |',
              '|------------|-----|--------|',
              `| Web App | [${PREVIEW_WEB_URL}](${PREVIEW_WEB_URL}) | ${{ needs.preview-web.result }} |`,
              `| API Worker | [${PREVIEW_API_URL}](${PREVIEW_API_URL}) | ${{ needs.preview-api.result }} |`,
              '',
              '### ⚡️ What to test',
              '- Feed loads and displays posts',
              '- Wallet connect flow',
              '- Cross-protocol replies',
              '- Search functionality',
              '- Messages and notifications',
              '',
              '---',
              '_🤖 Preview auto-updates on each push to this PR._',
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  preview-cleanup:
    name: Cleanup Old Previews
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: delete --env preview
        continue-on-error: true
