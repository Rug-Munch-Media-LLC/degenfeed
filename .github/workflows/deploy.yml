name: Deploy

# DegenFeed deploy — Docker (self-hosted API, no Cloudflare Worker).
#
# CF worker deploys (preview / deploy-canary / deploy-web / promote-canary)
# were REMOVED 2026-08-04: the API is now self-hosted at 127.0.0.1:3101 and
# the Next.js frontend proxies /api/* via next.config rewrites + WORKER_URL
# (see apps/web/next.config.mjs and .forgejo/workflows/deploy.yml, which is
# the active Forgejo CI). GitHub Actions runs smoke + lighthouse only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://degenfeed.xyz
    steps:
      - name: Smoke test API health
        run: |
          echo "=== Self-hosted API health (via web proxy) ==="
          curl -sf --max-time 10 https://degenfeed.xyz/api/health || (echo "FAIL: /api/health" && exit 1)
          echo "PASS: /api/health"

          echo "=== Feed endpoint ==="
          curl -sf --max-time 15 https://degenfeed.xyz/api/feed/home?limit=1 || (echo "FAIL: /api/feed/home" && exit 1)
          echo "PASS: /api/feed/home"

          echo "=== Landing page ==="
          curl -sf --max-time 10 https://degenfeed.xyz/ | grep -q "DegenFeed" || (echo "FAIL: landing page" && exit 1)
          echo "PASS: landing page"

          echo "=== Web app ==="
          curl -sf --max-time 10 https://app.degenfeed.xyz/ | grep -q "DegenFeed" || (echo "FAIL: web app" && exit 1)
          echo "PASS: web app"

          echo "All smoke tests passed."

  lighthouse:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Run Lighthouse CI audits
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN || '' }}

  notify-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [smoke-test, lighthouse]
    steps:
      - name: Ping on deploy failure
        run: |
          echo "::error::Deploy failed for ${{ github.ref }} — see run logs"
          # Add Slack/Discord/PagerDuty webhook here when ready.
          exit 1
