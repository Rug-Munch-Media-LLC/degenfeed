name: AI Code Review (Multi-Model)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          echo "diff_lines=$(wc -l < /tmp/pr.diff)" >> $GITHUB_OUTPUT

      - name: AI Review (DeepSeek V4 Pro)
        uses: actions/github-script@v7
        if: steps.diff.outputs.diff_lines < 2000
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/pr.diff', 'utf8');

            const review = await fetch('https://api.deepseek.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.DEEPSEEK_API_KEY}`
              },
              body: JSON.stringify({
                model: 'deepseek-v4-pro',
                messages: [{
                  role: 'system',
                  content: `You are a strict code reviewer. Review this PR diff for:
1. Hallucinated imports or fake function calls
2. Type safety violations (Any/any in public APIs)
3. Bare except / empty catch blocks
4. Security issues (hardcoded secrets, unsafe HTML)
5. Architecture violations (wrong layer imports)
6. AI anti-patterns (console.log, magic numbers, placeholder code)

For each issue, report: [SEVERITY] file:line — Description
Severity: BLOCKER (cannot merge) | WARNING (should fix) | INFO (consider)
End with VERDICT: PASS / NEEDS_FIXES / REJECT`
                }, {
                  role: 'user',
                  content: `Review this PR diff:\n\n${diff}`
                }],
                temperature: 0.1,
                max_tokens: 4000
              })
            });

            const result = await review.json();
            const reviewText = result.choices[0].message.content;

            // Post review as PR comment
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review (DeepSeek V4 Pro)\n\n${reviewText}\n\n---\n*Automated review triggered by PR #${context.issue.number}*`
            });
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
