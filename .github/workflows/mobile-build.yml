# ── DegenFeed Mobile Build & Deploy ─────────────────────────────
# Builds iOS and Android apps on push to main and uploads to
# TestFlight (iOS) and Play Store Internal Track (Android).
#
# iOS builds require a macOS runner (self-hosted).
# Android builds run on ubuntu-latest.

name: Mobile Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Deployment track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 11.7.0
  APP_VERSION: ${{ github.ref_name == 'main' && '1.0.0' || '0.0.0' }}

# ── Permissions ─────────────────────────────────────────────────
permissions:
  contents: read
  id-token: write

jobs:
  # ── Install & Build Web ───────────────────────────────────
  build-web:
    name: Build web artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build web app
        run: pnpm --filter degenfeed-web build
        env:
          NEXT_PUBLIC_SITE_URL: https://app.degenfeed.xyz

      - name: Extract version
        id: version
        run: echo "version=$(node -p "require('./apps/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  # ── Build iOS (macOS runner required) ─────────────────────
  build-ios:
    name: Build iOS
    needs: build-web
    runs-on: [self-hosted, macOS, arm64]
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next

      - name: Sync Capacitor iOS
        run: |
          cd apps/web
          npx cap sync ios

      - name: Set build number
        run: |
          cd apps/web/ios/App
          agvtool new-marketing-version "${{ needs.build-web.outputs.version }}"
          agvtool new-version -all "${{ needs.build-web.outputs.build_number }}"

      - name: Build iOS archive
        run: |
          cd apps/web/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/DegenFeed.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE }}"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ${{ runner.temp }}/DegenFeed.xcarchive \
            -exportPath ${{ runner.temp }}/ipa \
            -exportOptionsPlist apps/web/ios/exportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: degenfeed-ios-${{ needs.build-web.outputs.version }}-${{ needs.build-web.outputs.build_number }}
          path: ${{ runner.temp }}/ipa/DegenFeed.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main'
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ${{ runner.temp }}/ipa/DegenFeed.ipa \
            --username "$APP_STORE_CONNECT_USERNAME" \
            --password "@env:APP_STORE_CONNECT_PASSWORD" \
            --output-format json

  # ── Build Android ─────────────────────────────────────────
  build-android:
    name: Build Android
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.next

      - name: Sync Capacitor Android
        run: |
          cd apps/web
          npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.PLAY_STORE_UPLOAD_KEYSTORE }}" | base64 -d > apps/web/android/app/degenfeed-upload.keystore

      - name: Build Android AAB
        run: |
          cd apps/web/android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/degenfeed-upload.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.PLAY_STORE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.PLAY_STORE_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: degenfeed-android-${{ needs.build-web.outputs.version }}-${{ needs.build-web.outputs.build_number }}
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Deploy to Play Store
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: xyz.degenfeed.app
          releaseFiles: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: mobile/play-store/whats-new/

  # ── Notification ──────────────────────────────────────────
  notify:
    name: Notify team
    needs: [build-ios, build-android]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify on Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,author,commit,workflow
          text: |
            🚀 DegenFeed Mobile Build Complete
            Version: ${{ needs.build-web.outputs.version }} (Build ${{ needs.build-web.outputs.build_number }})
            iOS: ${{ needs.build-ios.result }}
            Android: ${{ needs.build-android.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
