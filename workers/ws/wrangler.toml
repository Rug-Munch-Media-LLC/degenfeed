name = "degenfeed-ws"
main = "src/index.ts"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "REALTIME_SERVER"
class_name = "RealtimeServer"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeServer"]

# Routes for WebSocket connections
routes = [
  { pattern = "realtime.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]

[vars]
# Comma-separated list of allowed CORS origins
ALLOWED_ORIGINS = "https://degenfeed.xyz,https://app.degenfeed.xyz,https://social.degenfeed.xyz,http://localhost:3000"

[env.preview]
name = "degenfeed-ws-preview"
routes = [
  { pattern = "ws-preview.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]
