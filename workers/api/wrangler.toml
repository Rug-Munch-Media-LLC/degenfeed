name = "degenfeed-api"
main = "src/index.ts"
compatibility_date = "2024-05-01"

# KV namespaces for caching
# Use `wrangler kv:namespace create degenfeed-cache` then add the id here
# [[kv_namespaces]]
# binding = "CACHE"
# id = ""

