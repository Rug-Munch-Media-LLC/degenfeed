# Secrets — set with:
#   wrangler secret put AUTH_SECRET
#   wrangler secret put GTS_CLIENT_SECRET
#   wrangler secret put PUSH_API_KEY
#   wrangler secret put NEWSLETTER_API_KEY
#   wrangler secret put ADMIN_WALLETS
#   wrangler secret put ADMIN_API_KEY  (deprecated — use scoped keys above)
#   wrangler secret put PEERTUBE_CLIENT_SECRET
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put NOSTR_PRIVATE_KEY
#   wrangler secret put NEYNAR_API_KEY
#   wrangler secret put PINATA_API_KEY
#   wrangler secret put PINATA_SECRET_KEY
#   wrangler secret put PREMIUM_WALLET_KEY
#   wrangler secret put POSTMARK_SERVER_TOKEN
#   wrangler secret put MEILI_SEARCH_KEY
#   wrangler secret put RMI_API_KEY
#   wrangler secret put SENTRY_DSN
#   wrangler secret put THREADS_APP_SECRET
#   wrangler secret put REDDIT_CLIENT_SECRET
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put DISCORD_CLIENT_SECRET
#   wrangler secret put TWITTER_CLIENT_SECRET
#   wrangler secret put VAPID_PRIVATE_KEY
#   wrangler secret put POSTIZ_API_KEY
# Generate AUTH_SECRET with:  openssl rand -hex 32
# GTS_CLIENT_SECRET is from your GotoSocial app config.
# PUSH_API_KEY — scoped key for POST /api/push/send (push notification sending)
# NEWSLETTER_API_KEY — scoped key for GET /api/newsletter/status (subscriber count)
# ADMIN_API_KEY — retained as fallback if scoped keys are not set
# Secrets are NEVER committed to git; only set via wrangler.
#
# [env.preview] secrets can be different (use --env preview on wrangler).

[vars]
# Non-secret config — safe to commit
GTS_CLIENT_ID = "01X3AAWH39P71TXZVKMEGAKMVC" # gitleaks:allow
GTS_INSTANCE_URL = "https://social.degenfeed.xyz"
GTS_API_BASE = "https://social.degenfeed.xyz"
GTS_REDIRECT_URI = "https://app.degenfeed.xyz/auth/callback"
RELAY_URLS = "wss://relay.damus.io,wss://relay.primal.net"
FARCASTER_HUB_URL = "https://hub.farcaster.standardcrypto.vc:2281"
LENS_API_URL = "https://api.lens.xyz/graphql"
BSKY_PUBLIC_URL = "https://public.api.bsky.app"
THREADS_PDS_URL = "https://public.threads.net"
# Meta Threads API credentials — for official graph.threads.net publishing
# Set via wrangler secret: wrangler secret put THREADS_APP_SECRET
# THREADS_APP_ID and THREADS_APP_SECRET are from the Meta Developer Dashboard
THREADS_APP_ID = ""
# Farcaster Warpcast OAuth — for /api/auth/warpcast/* routes
FARCASTER_CLIENT_ID = ""
# Reddit OAuth — for /api/auth/reddit/callback route
REDDIT_CLIENT_ID = ""
# Comma-separated admin wallet addresses for moderation/admin API access.
# Set via wrangler secret in production; example value here for preview/dev.
# ADMIN_WALLETS = "0x1e3ac01d0fdb976179790bdd02823196a92705c9"

# Comma-separated list of allowed CORS origins for state-changing requests.
# Add your own preview hosts here.
ALLOWED_ORIGINS = "https://degenfeed.xyz,https://app.degenfeed.xyz,https://social.degenfeed.xyz,http://localhost:3000"
RATE_WINDOW_MS = "5000"
RATE_MAX_REQ = "60"
RATE_LIMIT_DISABLED = "false"
# Error tracking via GlitchTip (MIT, self-hosted Sentry-compatible)
# Deploy GlitchTip on Talos first, then set DSN via:
#   wrangler secret put GLITCHTIP_DSN
# The SDK is the same @sentry/cloudflare — just point at glitchtip.rugmunch.io
# The worker reads this at runtime via env.SENTRY_DSN.
SENTRY_DSN = ""
# Self-hosted Redlib instance for Reddit feed proxying
REDLIB_URL = "https://redlib.degenfeed.xyz"
# Self-hosted RSS-Bridge instance for proxied RSS feed fetching
FLARESOLVERR_URL = "http://localhost:8191"
RMI_BACKEND_URL = "http://localhost:8000"
RSS_BRIDGE_URL = "https://rss-bridge.degenfeed.xyz"
# Bridge service URL for protocol feed fetching
BRIDGE_INTERNAL_URL = "https://bridge.degenfeed.xyz"
# Feature flags — comma-separated list of flags that should default to enabled
FEATURE_FLAGS_DEFAULT = "reply-composer,dark-mode-only,farcaster-frames"
# Postiz cross-posting API — for scheduled social media publishing
POSTIZ_BASE_URL = "http://127.0.0.1:3105"
POSTIZ_API_KEY = "${POSTIZ_API_KEY}"
POSTIZ_INTEGRATIONS = ""

# PeerTube — self-hosted video + livestream platform
PEERTUBE_INSTANCE_URL = "https://video.degenfeed.xyz"
PEERTUBE_CLIENT_ID = ""
PEERTUBE_CLIENT_SECRET = ""

# Telegram bot for OAuth + livestream notifications
TELEGRAM_BOT_NAME = ""

# EVM RPC endpoints for on-chain operations
BASE_RPC_URL = "https://mainnet.base.org"
BASE_SEPOLIA_RPC_URL = "https://sepolia.base.org"
POLYGON_RPC_URL = "https://polygon-rpc.com"

# Mastodon instance for account creation (defaults to GoToSocial)
MASTODON_INSTANCE_URL = "https://social.degenfeed.xyz"
GOTOSOCIAL_INSTANCE_URL = "https://social.degenfeed.xyz"

# Lemmy instance for account creation
LEMMY_INSTANCE_URL = "https://community.degenfeed.xyz"

# Pixelfed instance for account creation
PIXELFED_INSTANCE_URL = "https://pixelfed.social"

# Creator coin contracts
ZORA_WRAPPER_FACTORY = "0x0000000000000000000000000000000000000000"

# Cross-chain bridge (Wormhole)
WORMHOLE_BRIDGE = ""

# Optional — OAuth allow-all for local dev
ALLOW_DEV_OAUTH = "false"

# Bluesky AT Protocol posting — DID for identity
BSKY_DID = ""

# YouTube Data API v3 key
YOUTUBE_API_KEY = ""

# Solana — RPC URL for wallet verification, Blinks, and billing
SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
SOLANA_DEVNET_RPC_URL = "https://api.devnet.solana.com"

# Creator coin factory contract addresses
# COIN_FACTORY_ADDRESS_TESTNET = "0x7691e6E14fF349B854738C8A8Aac2314558125B6"

# OAuth provider client IDs (non-secret — set corresponding _SECRET as wrangler secret)
GOOGLE_CLIENT_ID = ""
GITHUB_CLIENT_ID = ""
DISCORD_CLIENT_ID = ""
TWITTER_CLIENT_ID = ""

# VAPID keys for Web Push notifications (public key is safe in vars; private key as secret)
VAPID_SUBJECT = "mailto:admin@degenfeed.xyz"
VAPID_PUBLIC_KEY = ""

# Bluesky AT Protocol resolve URLs
BSKY_SOCIAL_URL = "https://bsky.social"

# Per-environment overrides. Preview deploys (PR builds) use --env preview.
[env.preview]
name = "degenfeed-api-preview"
routes = [
  { pattern = "preview.degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "preview.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]
[env.preview.vars]
ALLOWED_ORIGINS = "https://preview.degenfeed.xyz,https://app.preview.degenfeed.xyz,http://localhost:3000"
RATE_MAX_REQ = "600"

[env.canary]
name = "degenfeed-api-canary"
routes = [
  { pattern = "canary.degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "canary.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]
[env.canary.vars]
ALLOWED_ORIGINS = "https://canary.degenfeed.xyz,http://localhost:3000"

# Package aliases — resolves monorepo workspace packages for esbuild
[alias]
"@degenfeed/cross-protocol-bridge" = "../../packages/cross-protocol-bridge/src/index.ts"
"@degenfeed/crypto" = "../../packages/crypto/src/e2e-messaging.ts"
"@degenfeed/realtime" = "../../packages/realtime/src/index.ts"
"@degenfeed/realtime/message-bridge" = "../../packages/realtime/src/message-bridge.ts"

# Cron triggers — scheduled Worker invocations.
# Every minute:   scheduled post executor
# Every 30 min:   trending scraper
# Daily 14:00:    daily digest + trending refresh
# Sunday 12:00:   weekly source discovery + health maintenance
# Remove the [triggers] block to disable; ideal cost is ~zero.
[triggers]
crons = ["* * * * *", "*/5 * * * *", "*/30 * * * *", "0 14 * * *", "0 12 * * 0"]
