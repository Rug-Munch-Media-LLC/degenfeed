# Routes — main app + api on degenfeed.xyz domain
routes = [
  { pattern = "degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "app.degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "rugmunch.io/links", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]

# Secrets — set with:
#   wrangler secret put AUTH_SECRET
#   wrangler secret put GTS_CLIENT_SECRET
#   wrangler secret put PUSH_API_KEY
#   wrangler secret put NEWSLETTER_API_KEY
#   wrangler secret put ADMIN_API_KEY  (deprecated — use scoped keys above)
# Generate AUTH_SECRET with:  openssl rand -hex 32
# GTS_CLIENT_SECRET is from your GotoSocial app config.
# PUSH_API_KEY — scoped key for POST /api/push/send (push notification sending)
# NEWSLETTER_API_KEY — scoped key for GET /api/newsletter/status (subscriber count)
# ADMIN_API_KEY — retained as fallback if scoped keys are not set
# Secrets are NEVER committed to git; only set via wrangler.
#
# [env.preview] secrets can be different (use --env preview on wrangler).

[vars]
# Non-secret config — safe to commit
GTS_CLIENT_ID = "01X3AAWH39P71TXZVKMEGAKMVC" # gitleaks:allow
GTS_INSTANCE_URL = "https://social.degenfeed.xyz"
GTS_API_BASE = "https://social.degenfeed.xyz"
GTS_REDIRECT_URI = "https://app.degenfeed.xyz/auth/callback"
RELAY_URLS = "wss://relay.damus.io,wss://relay.primal.net"
FARCASTER_HUB_URL = "https://hub.farcaster.standardcrypto.vc:2281"
LENS_API_URL = "https://api.lens.xyz/graphql"
BSKY_PUBLIC_URL = "https://public.api.bsky.app"
THREADS_PDS_URL = "https://public.threads.net"
# Meta Threads API credentials — for official graph.threads.net publishing
# Set via wrangler secret: wrangler secret put THREADS_APP_SECRET
# THREADS_APP_ID and THREADS_APP_SECRET are from the Meta Developer Dashboard
THREADS_APP_ID = ""
# Farcaster Warpcast OAuth — for /api/auth/warpcast/* routes
FARCASTER_CLIENT_ID = ""
# Reddit OAuth — for /api/auth/reddit/callback route
REDDIT_CLIENT_ID = ""
# Comma-separated list of allowed CORS origins for state-changing requests.
# Add your own preview hosts here.
ALLOWED_ORIGINS = "https://degenfeed.xyz,https://app.degenfeed.xyz,https://social.degenfeed.xyz,http://localhost:3000"
RATE_WINDOW_MS = "5000"
RATE_MAX_REQ = "60"
RATE_LIMIT_DISABLED = "false"
# Error tracking via GlitchTip (MIT, self-hosted Sentry-compatible)
# Deploy GlitchTip on Talos first, then set DSN via:
#   wrangler secret put GLITCHTIP_DSN
# The SDK is the same @sentry/cloudflare — just point at glitchtip.rugmunch.io
# The worker reads this at runtime via env.SENTRY_DSN.
SENTRY_DSN = ""
# Self-hosted Redlib instance for Reddit feed proxying
REDLIB_URL = "https://redlib.degenfeed.xyz"
# Self-hosted RSS-Bridge instance for proxied RSS feed fetching
FLARESOLVERR_URL = "http://100.104.130.92:8191"
RMI_BACKEND_URL = "http://100.104.130.92:8000"
RSS_BRIDGE_URL = "https://rss-bridge.degenfeed.xyz"
# Feature flags — comma-separated list of flags that should default to enabled
FEATURE_FLAGS_DEFAULT = "reply-composer,dark-mode-only,farcaster-frames"
# Postiz cross-posting API — for scheduled social media publishing
POSTIZ_BASE_URL = "http://127.0.0.1:3105"
POSTIZ_API_KEY = "CHANGEME"
POSTIZ_INTEGRATIONS = ""

# Per-environment overrides. Preview deploys (PR builds) use --env preview.
[env.preview]
name = "degenfeed-api-preview"
routes = [
  { pattern = "preview.degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "preview.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]
[env.preview.vars]
ALLOWED_ORIGINS = "https://preview.degenfeed.xyz,https://app.preview.degenfeed.xyz,http://localhost:3000"
RATE_MAX_REQ = "600"

[env.canary]
name = "degenfeed-api-canary"
routes = [
  { pattern = "canary.degenfeed.xyz/api/*", zone_id = "116a9676c3358def6796910ccb96f1fc" },
  { pattern = "canary.degenfeed.xyz/*", zone_id = "116a9676c3358def6796910ccb96f1fc" }
]
[env.canary.vars]
ALLOWED_ORIGINS = "https://canary.degenfeed.xyz,http://localhost:3000"

# Cron triggers — scheduled Worker invocations.
# Daily digest fires at 14:00 UTC (9 AM Eastern).
# Remove the [triggers] block to disable; ideal cost is ~zero.
[triggers]
crons = ["0 14 * * *"]
