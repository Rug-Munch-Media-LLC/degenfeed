rules:
  - id: no-hardcoded-api-keys
    pattern-either:
      - pattern-regex: (?:api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"][A-Za-z0-9_\-]{20,}['"]
      - pattern-regex: (?:sk[-_](?:live|test|prod)_[A-Za-z0-9]{10,})
      - pattern-regex: (?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}
      - pattern-regex: (?:xox[bpras]-[A-Za-z0-9-]{10,})
      - pattern-regex: (?:AKIA[0-9A-Z]{16})
    message: >-
      Hardcoded API key or secret token detected. Use environment variables
      or a secrets manager instead of embedding credentials in source code.
    languages:
      - javascript
      - typescript
      - python
      - go
      - bash
      - yaml
      - json
    severity: ERROR

  - id: no-private-key-literals
    patterns:
      - pattern-either:
          - pattern-regex: -----BEGIN\s(?:RSA\s)?PRIVATE\sKEY-----
          - pattern-regex: (?:0x[0-9a-fA-F]{64,})
      - pattern-not-regex: (?:0x[0-9a-fA-F]{40})  # address, not key
    message: >-
      Private key or long hex string detected in source code.
      This is a critical security issue. Store keys in environment
      variables or a secrets vault.
    languages:
      - javascript
      - typescript
      - python
      - go
      - bash
      - yaml
    severity: ERROR

  - id: no-connection-strings
    patterns:
      - pattern-regex: (?:postgres(?:ql)?|mysql|redis|mongodb(?:\+srv)?)://[^\s'"]+:[^\s'"]+@
    message: >-
      Database connection string with embedded credentials detected.
      Use environment variables for connection strings, never hardcode.
    languages:
      - javascript
      - typescript
      - python
      - go
      - yaml
    severity: ERROR
