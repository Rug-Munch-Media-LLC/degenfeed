# ── DegenFeed Deploy — Docker (self-hosted API, no Cloudflare Worker) ─────
# On push to main:
#   1. Build & push Docker image → deploy to server
#   2. Smoke test all endpoints
#
# CF worker deploys (deploy-canary, deploy-web) are DISABLED 2026-08-04:
# the API is now self-hosted at 127.0.0.1:3101 and the frontend proxies
# /api/* via next.config rewrites + WORKER_URL (see apps/web/next.config.mjs).
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: degenfeed-web
  REGISTRY_USER: cryptorugmunch

jobs:
  # ── Cloudflare Worker: Canary → Production ────────────────────
  # DISABLED 2026-08-04: CF worker retired — API is self-hosted at
  # 127.0.0.1:3101. Re-enable only if we go back to edge workers.
