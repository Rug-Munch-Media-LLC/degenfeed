# ── DegenFeed Deploy — systemd standalone (production reality) ──────────
# PRODUCTION TOPOLOGY (verified 2026-08-30):
#   nginx → degenfeed-web.service (Next.js standalone, 127.0.0.1:3100)
#         → degenfeed-bridge.service (feed API, 0.0.0.0:8787)
#   The systemd unit runs FROM this repo's checkout:
#     WorkingDirectory=/srv/work/repos/degenfeed-web/apps/web/.next/standalone/apps/web
#   so "deploy" = update the checkout → rebuild → restart the unit.
#
# The previous Docker path (docker/build-and-push-action@v6 — an action that
# does not exist; ghcr.io push → `docker compose pull web`) deployed an image
# nothing ran: the live compose file references a local `degenfeed:latest`
# build and the service is systemd, not compose. That path is removed.
#
# REQUIRED SECRETS (Forgejo repo settings):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, (optional) DEPLOY_PORT
# The SSH user needs write access to the repo checkout and sudo rights for
# `systemctl restart degenfeed-web` (or a passwordless sudoers rule for it).
#
# [FOLLOW-UP — lead executes, not CI-first-run]: validate the sudoers rule and
# run once via workflow_dispatch before relying on push-to-main deploys.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Deploy: update checkout → build → restart systemd unit ────
  systemd-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: docker-x64
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.degenfeed.xyz
    steps:
      - name: Deploy via SSH (git pull → build → systemctl restart)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/srv/work/repos/degenfeed-web
            SERVICE=degenfeed-web
            cd "$APP_DIR"
            echo "=== Updating checkout to ${{ github.sha }} ==="
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo "=== Installing dependencies (frozen lockfile) ==="
            pnpm install --frozen-lockfile
            echo "=== Building web app (standalone) ==="
            pnpm --filter degenfeed build
            echo "=== Restarting $SERVICE ==="
            sudo systemctl restart "$SERVICE"
            echo "=== Waiting for health check ==="
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
                echo "Health check PASSED"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check FAILED after 60s"
                journalctl -u "$SERVICE" --no-pager -n 30
                exit 1
              fi
              sleep 5
            done

  # ── Final smoke test against production ──────────────────────
  smoke-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: docker-x64
    timeout-minutes: 10
    needs: [systemd-deploy]
    environment:
      name: production
      url: https://degenfeed.xyz
    steps:
      - name: Smoke test all endpoints
        run: |
          echo "=== App health (Next.js :3100 via nginx) ==="
          curl -sf --max-time 10 https://app.degenfeed.xyz/api/health \
            || (echo "FAIL: app /api/health" && exit 1)
          echo "PASS: app /api/health"
          echo "=== Feed endpoint routing (bridge :8787 via nginx) ==="
          # The bridge requires Bearer BRIDGE_API_KEY on feed routes, so an
          # UNAUTHENTICATED probe must return 401. 401/200 = nginx→bridge
          # routing works; 502/000 = upstream broken (the old :3101 failure).
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://app.degenfeed.xyz/api/feed/home?limit=1")
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "FAIL: /api/feed/home returned $code (expected 200 or 401)"
            exit 1
          fi
          echo "PASS: /api/feed/home routed (HTTP $code)"
          echo "=== Landing page ==="
          curl -sfL --max-time 10 https://degenfeed.xyz/ | grep -q "DegenFeed" \
            || (echo "FAIL: landing page" && exit 1)
          echo "PASS: landing page"
          echo "=== Web app ==="
          curl -sfL --max-time 10 https://app.degenfeed.xyz/ | grep -q "DegenFeed" \
            || (echo "FAIL: web app" && exit 1)
          echo "PASS: web app"
          echo "All smoke tests passed."

  # ── Notify on failure ────────────────────────────────────────
  notify-failure:
    if: failure()
    runs-on: docker-x64
    needs: [systemd-deploy, smoke-test]
    steps:
      - name: Emit deploy failure
        run: |
          echo "::error::Deploy failed for ${{ github.ref }} — see run logs"
          exit 1
