  #       with:
  #         version: 11.7.0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - name: Typecheck worker
  #       run: pnpm --filter @degenfeed/api-worker typecheck
  #     - name: Test worker
  #       run: pnpm --filter @degenfeed/api-worker test
  #     - name: Build worker (dry-run)
  #       run: pnpm --filter @degenfeed/api-worker build
  #     - name: Deploy worker (canary)
  #       uses: cloudflare/wrangler-action@v3
  #       with:
  #         apiToken: ${{ secrets.CF_API_TOKEN }}
  #         accountId: ${{ secrets.CF_ACCOUNT_ID }}
  #         workingDirectory: workers/api
  #         command: deploy --env canary
  #     - name: Smoke test canary
  #       run: |
  #         echo "=== Canary API health ==="
  #         curl -sf --max-time 10 https://canary.degenfeed.xyz/api/health \
  #           || (echo "FAIL: canary /api/health" && exit 1)
  #         echo "PASS: canary /api/health"
  #         echo "=== Canary feed endpoint ==="
  #         curl -sf --max-time 15 https://canary.degenfeed.xyz/api/feed/home?limit=1 \
  #           || (echo "FAIL: canary /api/feed/home" && exit 1)
  #         echo "PASS: canary /api/feed/home"
  #     - name: Promote to production
  #       uses: cloudflare/wrangler-action@v3
  #       with:
  #         apiToken: ${{ secrets.CF_API_TOKEN }}
  #         accountId: ${{ secrets.CF_ACCOUNT_ID }}
  #         workingDirectory: workers/api
  #         command: deploy
  #     - name: Smoke test production
  #       run: |
  #         echo "=== Production API health ==="
  #         curl -sf --max-time 10 https://degenfeed.xyz/api/health \
  #           || (echo "FAIL: /api/health" && exit 1)
  #         echo "PASS: /api/health"
  #         echo "=== Feed endpoint ==="
  #         curl -sf --max-time 15 https://degenfeed.xyz/api/feed/home?limit=1 \
  #           || (echo "FAIL: /api/feed/home" && exit 1)
  #         echo "PASS: /api/feed/home"

  # ── Cloudflare Pages: Frontend deploy ────────────────────────
  # DISABLED 2026-08-04: frontend is served from the Docker container
  # (nginx → 127.0.0.1:3100), not Cloudflare Pages.
  # deploy-web:
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   runs-on: ubuntu-latest
  #   environment:
  #     name: production
  #     url: https://app.degenfeed.xyz
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@v4
  #       with:
  #         version: 11.7.0
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm --filter degenfeed-web pages:build
  #     - name: Deploy to Cloudflare Pages
  #       uses: cloudflare/wrangler-action@v3
  #       with:
  #         apiToken: ${{ secrets.CF_API_TOKEN }}
  #         accountId: ${{ secrets.CF_ACCOUNT_ID }}
  #         workingDirectory: apps/web
  #         command: pages deploy .vercel/output/static --project-name degenfeed-web

  # ── Docker: Build image & push to registry ────────────────────
  docker-build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-and-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ADMIN_WALLETS=${{ vars.NEXT_PUBLIC_ADMIN_WALLETS || '' }}
            NEXT_PUBLIC_APP_URL=https://app.degenfeed.xyz
            NEXT_PUBLIC_API_BASE=https://degenfeed.xyz
            NEXT_PUBLIC_API_URL=https://degenfeed.xyz

  # ── Deploy Docker to production server ────────────────────────
  docker-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker-build]
    environment:
      name: production
      url: https://app.degenfeed.xyz
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/degenfeed
            echo "=== Pulling latest Docker image ==="
            docker compose pull web
            echo "=== Recreating web service ==="
            docker compose up -d --remove-orphans web
            echo "=== Waiting for health check ==="
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
                echo "Health check PASSED"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check FAILED after 60s"
                docker compose logs --tail=20 web
                exit 1
              fi
              sleep 5
            done
            echo "=== Cleaning up old images ==="
            docker image prune -f --filter "until=24h"

  # ── Final smoke test against production ──────────────────────
  smoke-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker-deploy]
    environment:
      name: production
      url: https://degenfeed.xyz
    steps:
      - name: Smoke test all endpoints
        run: |
          echo "=== Self-hosted API health (via web proxy) ==="
          curl -sf --max-time 10 https://degenfeed.xyz/api/health \
            || (echo "FAIL: /api/health" && exit 1)
          echo "PASS: /api/health"
          echo "=== Feed endpoint ==="
          curl -sf --max-time 15 https://degenfeed.xyz/api/feed/home?limit=1 \
            || (echo "FAIL: /api/feed/home" && exit 1)
          echo "PASS: /api/feed/home"
          echo "=== Landing page ==="
          curl -sfL --max-time 10 https://degenfeed.xyz/ | grep -q "DegenFeed" \
            || (echo "FAIL: landing page" && exit 1)
          echo "PASS: landing page"
          echo "=== Web app ==="
          curl -sfL --max-time 10 https://app.degenfeed.xyz/ | grep -q "DegenFeed" \
            || (echo "FAIL: web app" && exit 1)
          echo "PASS: web app"
          echo "All smoke tests passed."

  # ── Notify on failure ────────────────────────────────────────
  notify-failure:
    if: failure()
    runs-on: ubuntu-latest
    needs: [docker-build, docker-deploy, smoke-test]
    steps:
      - name: Emit deploy failure
        run: |
          echo "::error::Deploy failed for ${{ github.ref }} — see run logs"
          exit 1
