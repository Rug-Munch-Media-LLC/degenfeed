# ── DegenFeed CI — Quality Gates on Every Push ─────────────────
# Forgejo Actions (compatible subset of GitHub Actions syntax).
# Gates: lint → typecheck → test → build → security
name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**, hotfix/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lefthook
        run: curl -1sLf 'https://github.com/evilmartians/lefthook/releases/download/v1.7.18/lefthook_1.7.18_linux_amd64.tar.gz' | tar xz -C /usr/local/bin
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lefthook pre-commit hooks
        run: lefthook run pre-commit

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  # ── Gate 0: Oxlint pre-pass (fast common checks) ────────────────
  oxlint-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx oxlint@latest --max-warnings=0 packages/ apps/

  # ── Gate 1: Static analysis (Biome) ────────────────────────────
  lint:
    needs: [oxlint-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Stylelint CSS
        run: npx stylelint "**/*.css" --allow-empty-input

  # ── Gate 2: TypeScript type-check ────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── Gate 3: Unit + integration tests ─────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unittests
          name: degenfeed-web
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()

  # ── Gate 4: Build (all packages + apps) ──────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed-web build
      - name: Build worker (dry-run)
        run: pnpm --filter @degenfeed/api-worker build

  # ── Gate 5: Bundle size gating ──────────────────────────────────
  bundlewatch:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed-web build
      - name: BundleWatch
        run: npx bundlewatch --config bundlewatch.config.json

  # ── Gate 6: SBOM (Software Bill of Materials) ──────────────────
  sbom:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ── Gate 6: Dependency freshness ──────────────────────────────
  deps-freshness:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependency freshness
        run: npx npm-check-updates --format group || echo "Dep freshness noted"
        continue-on-error: true

  # ── Gate 6: Security — secret scanning + dep audit ───────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-banner --exit-code 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        id: audit
        run: pnpm audit --prod --audit-level=high 2>&1 | tee /tmp/audit.log
      - name: Fail on critical/high vulnerabilities
        if: failure()
        run: |
          echo "::error::pnpm audit found HIGH or CRITICAL vulnerabilities"
          exit 1

  # ── Gate 6: Dead-code detection with knip ─────────────────────
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx knip --no-progress

  # ── Gate 7: Markdown link check ──────────────────────────────
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin --strip-components=1
      - name: Check links in docs
        run: lychee --no-progress --accept 200,204,301,302,304 '**/*.md' --exclude 'node_modules' --exclude 'dist' --exclude '.next' --exclude '.turbo' --exclude 'coverage'

  # ── Gate 8: E2E tests (Playwright) ──────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter degenfeed-web test:e2e

  # ── Gate 9: Lefthook-mirror checks ──────────────────────────
  # Mirrors pre-commit hooks from lefthook.yml
  lefthook-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file sizes
        run: bash scripts/check-file-sizes.sh
      - name: Check stubs
        run: bash scripts/check-stubs.sh
