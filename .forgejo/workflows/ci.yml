# ── DegenFeed CI — Quality Gates on Every Push ─────────────────
# Forgejo Actions (compatible subset of GitHub Actions syntax).
# Gates: lint → typecheck → test → build → security
#
# RUNNER REALITY (fixed 2026-08-30): the Forgejo runner registers ONLY the
# label `docker-x64` (docker://node:22-bookworm-slim, host network, capacity 2).
# Every job previously declared `runs-on: ubuntu-latest` — a label no runner
# has — so jobs queued forever and 54/60 recent pushes were cancelled. All
# jobs now run on docker-x64. Consequences:
#   - No Docker daemon inside jobs → container build/sign gates removed;
#     Trivy runs as a filesystem scan instead.
#   - Host networking → jobs must NOT bind host ports (3000 = Forgejo);
#     app-starting gates use PORT=3456 + the standalone server.
# Follow-up (lead): optionally add an `ubuntu-latest` alias label to
# /etc/forgejo-runner/config.yaml — not required while jobs target docker-x64.
name: CI

on:
  push:
    branches: [main, feat/**, fix/**, chore/**, hotfix/**]
  pull_request:
    branches: [main]
  schedule:
    # Nightly deep scan (noseyparker + grype) — staggered fleet-wide.
    - cron: '15 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install lefthook
        run: curl -1sLf 'https://github.com/evilmartians/lefthook/releases/download/v1.7.18/lefthook_1.7.18_linux_amd64.tar.gz' | tar xz -C /usr/local/bin
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run lefthook pre-commit hooks
        run: lefthook run pre-commit

  commitlint:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  # ── Gate 0: Oxlint pre-pass (fast common checks) ────────────────
  oxlint-fast:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx oxlint@latest --max-warnings=0 packages/ apps/

  # ── Gate: Biome standalone lint + format check ─────────────────
  biome:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome lint
        run: npx biome lint . --no-errors-on-unmatched
      - name: Biome format check
        run: npx biome format . --no-errors-on-unmatched

  # ── Gate 1: Static analysis (Biome via turbo) ────────────────
  lint:
    needs: [oxlint-fast, biome]
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Stylelint CSS
        run: npx stylelint "**/*.css" --allow-empty-input

  # ── Gate 2: TypeScript type-check ────────────────────────────
  typecheck:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── Gate: Vitest standalone unit tests ────────────────────────
  vitest:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest run
        run: npx vitest run --reporter=verbose
      - name: Upload coverage
        uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: vitest-coverage
          path: coverage/

  # ── Gate 3: Unit + integration tests (via turbo) ─────────────
  test:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unittests
          name: degenfeed
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        if: always()

  # ── Gate 4: Build (all packages + apps) ──────────────────────
  build:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: Build worker (dry-run)
        run: pnpm --filter @degenfeed/api-worker build

  # ── Gate 5: Bundle size gating ──────────────────────────────────
  bundlewatch:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: BundleWatch
        run: npx bundlewatch --config bundlewatch.config.json

  # ── Gate 6: SBOM (Software Bill of Materials) ──────────────────
  sbom:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.spdx.json
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: sbom
          path: sbom.spdx.json

  # ── Gate: Dependency/filesystem vulnerability scan (Trivy) ─────
  # FS scan (not image scan): the docker-x64 runner container has no Docker
  # daemon/CLI, and prod runs via systemd (no image to scan). Scanning the
  # source tree + pnpm lockfile is the real, runnable gate.
  trivy-scan:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  # sign-image REMOVED 2026-08-30: pushed ghcr.io images nothing consumes —
  # production is the systemd standalone service (degenfeed-web.service), not
  # a container. Keyless cosign also requires Forgejo OIDC (not configured).
  # Revisit only if/when prod moves back to image-based deploys.

  # ── Gate 6: Dependency freshness ──────────────────────────────
  deps-freshness:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check dependency freshness
        run: npx npm-check-updates --format group || echo "Dep freshness noted"
        continue-on-error: true

  # ── Gate 6: Security — secret scanning + dep audit ───────────
  security:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Gitleaks secret scan (repo config)
        run: gitleaks detect --source . --config=.gitleaks.toml --no-banner --exit-code 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        id: audit
        # pipefail is REQUIRED: without it `| tee` masks pnpm's exit code and
        # this gate was cosmetic (always green).
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level=high 2>&1 | tee /tmp/audit.log

  # ── Gate 6: Dead-code detection with knip ─────────────────────
  knip:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx knip --no-progress

  # ── Gate 7: Markdown link check ──────────────────────────────
  links:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install lychee
        run: |
          curl -sSfL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin --strip-components=1
      - name: Check links in docs
        run: lychee --no-progress --accept 200,204,301,302,304 '**/*.md' --exclude 'node_modules' --exclude 'dist' --exclude '.next' --exclude '.turbo' --exclude 'coverage'

  # ── Gate 8: E2E tests (Playwright) ──────────────────────────
  e2e:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter degenfeed test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  # ── Gate 9: Lefthook-mirror checks ──────────────────────────
  # Mirrors pre-commit hooks from lefthook.yml
  lefthook-mirror:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check file sizes
        run: bash scripts/check-file-sizes.sh
      - name: Check stubs
        run: bash scripts/check-stubs.sh
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    timeout-minutes: 30
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  # ── Gate 10: Mutation testing (Stryker) — NIGHTLY ONLY ──────────
  # First iteration runs nightly; promote to per-PR once thresholds stabilise.
  mutation:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Stryker mutation tests
        run: npx stryker run --reporter json --reporter html
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/

  # ── Gate 11: Accessibility (axe-core via Playwright) ─────────
  a11y:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run axe-core accessibility tests
        # test:a11y script does not exist; the axe-a11y playwright project does.
        run: pnpm --filter degenfeed test:e2e --project=axe-a11y

  # ── Gate 12: Coverage enforcement ────────────────────────────
  coverage:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        # vitest.config.ts defines coverage thresholds — vitest exits non-zero
        # below them, so THIS step is the blocking gate (the old redundant
        # `nyc check-coverage` step + its continue-on-error were removed).
        run: pnpm test -- --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: unittests
          name: degenfeed
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Gate 13: visual-regression REMOVED 2026-08-30 — both steps were
  # continue-on-error (always green = cosmetic) and Lost Pixel has no
  # committed baselines, so a blocking run would be permanently red.
  # Re-add once baseline screenshots are committed and storybook:build works.

  # ── Gate 14: Lighthouse CI performance ───────────────────────
  lighthouse:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: Run Lighthouse CI
        # Starts the standalone server itself (PORT=3456 — host :3000 is
        # Forgejo under the runner's host networking) and collects against it.
        run: |
          npm install -g @lhci/cli@0.14.x
          PORT=3456 HOSTNAME=127.0.0.1 lhci autorun \
            --collect.startServerCommand="node apps/web/.next/standalone/apps/web/server.js" \
            --collect.url=http://localhost:3456 \
            --upload.target=temporary-public-storage
        continue-on-error: true

  # ── Gate 15: Stylelint standalone ────────────────────────────
  stylelint:
    runs-on: docker-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Stylelint
        run: npx stylelint "**/*.css" --allow-empty-input

  # ── Gate 16/17: contract + fuzz REMOVED 2026-08-30 — they invoked
  # `pnpm --filter degenfeed test:contract` / `test:fuzz`, scripts that DO NOT
  # exist in apps/web/package.json. With continue-on-error they were fake
  # green gates. Re-add when the scripts actually exist.

  # ── Gate 18: API smoke test ─────────────────────────────────
  smoke:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      # output: 'standalone' → `next start` is unsupported; run the standalone
      # server directly. PORT=3456: the runner uses host networking and host
      # port 3000 is Forgejo itself — binding 3000 in CI fails with EADDRINUSE.
      - name: Start web app (standalone, port 3456)
        run: node apps/web/.next/standalone/apps/web/server.js &
        env:
          PORT: 3456
          HOSTNAME: 127.0.0.1
      - name: Wait for app to start
        run: sleep 10
      - name: Run smoke tests
        run: |
          curl -sf http://localhost:3456/api/health || exit 1
          curl -sf http://localhost:3456/ || exit 1
          echo "Smoke tests passed"

  # ── Gate 19: REMOVED — was a duplicate `smoke:` YAML key (same job id as
  # Gate 18). Duplicate keys are invalid YAML semantics; only the last block
  # won silently. Re-add under a unique id if a second smoke variant is needed.

  # ── Gate 20: Performance (k6) ───────────────────────────────
  performance:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: Start web app (standalone, port 3456)
        run: node apps/web/.next/standalone/apps/web/server.js &
        env:
          PORT: 3456
          HOSTNAME: 127.0.0.1
      - name: Wait for app to start
        run: sleep 10
      - name: Run k6 performance test
        run: |
          curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz | tar xz
          ./k6-v0.54.0-linux-amd64/k6 run --vus 10 --duration 30s - <<'K6SCRIPT'
          import http from 'k6/http';
          import { check } from 'k6';
          export default function () {
            const res = http.get('http://localhost:3456/');
            check(res, { 'status is 200': (r) => r.status === 200 });
          }
          K6SCRIPT
        continue-on-error: true

  # ── Gate 21: SEO check ──────────────────────────────────────
  seo:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: Start web app (standalone, port 3456)
        run: node apps/web/.next/standalone/apps/web/server.js &
        env:
          PORT: 3456
          HOSTNAME: 127.0.0.1
      - name: Wait for app to start
        run: sleep 10
      - name: Check SEO meta tags
        run: |
          curl -sf http://localhost:3456/ | grep -q "<title>" || exit 1
          curl -sf http://localhost:3456/ | grep -q "description" || exit 1
          echo "SEO check passed"

  # ── Gate 22: Security headers ───────────────────────────────
  security-headers:
    runs-on: docker-x64
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter degenfeed build
      - name: Start web app (standalone, port 3456)
        run: node apps/web/.next/standalone/apps/web/server.js &
        env:
          PORT: 3456
          HOSTNAME: 127.0.0.1
      - name: Wait for app to start
        run: sleep 10
      - name: Check security headers
        run: |
          curl -sI http://localhost:3456/ | grep -q "X-Content-Type-Options" || exit 1
          curl -sI http://localhost:3456/ | grep -q "X-Frame-Options" || exit 1
          echo "Security headers check passed"

  structure-gate:
    # Fleet coding gates (canonical toolkit synced from standards/fleet/gates).
    # degenfeed-web is a Next.js/TypeScript repo: the only Python surface is
    # scripts/ (the gate scripts themselves), so the Python structure and
    # monkeypatch gates scan scripts/ and the antipattern gate (which also
    # scans TS/JS slop markers) covers the whole repo. All baselines are
    # shrink-only: files may SHRINK freely; growth or NEW offenders fail.
    # Regenerate deliberately: --update-baseline.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Structure gate (<=200 lines, shrink-only allowlist)
        run: python3 scripts/check-structure.py --repo . --scan-root scripts
      - name: Monkeypatch gate (decrease-only ratchet)
        run: python3 scripts/check-monkeypatch.py --repo .
      - name: Antipattern gate (per-repo ratchet, incl. TS/JS slop markers)
        run: python3 scripts/check-antipatterns.py --repo .
      - name: Gate self-test (proves each gate catches its violation class)
        run: bash scripts/ci-gate-selftest.sh
