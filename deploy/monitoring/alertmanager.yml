# ──────────────────────────────────────────────────────────────────────────────
# DegenFeed — Alertmanager Configuration (Template)
# ──────────────────────────────────────────────────────────────────────────────
global:
  resolve_timeout: 5m
  slack_api_url: ""    # Configure via environment variable
  pagerduty_url: ""    # Configure via environment variable

route:
  receiver: "default"
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  group_by: [alertname, severity]
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

receivers:
  - name: "default"
    slack_configs:
      - channel: "#alerts"
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        send_resolved: true

  - name: "critical"
    slack_configs:
      - channel: "#critical"
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        send_resolved: true
    pagerduty_configs:
      - routing_key: ""
        severity: critical
        description: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
