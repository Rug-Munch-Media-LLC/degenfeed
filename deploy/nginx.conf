# DegenFeed Self-Hosted — nginx Reverse Proxy Configuration
# ==========================================================
# Place at: ./nginx.conf (mounted by docker-compose.prod.yml)
#
# TLS setup options:
#   Option A — Cloudflare (recommended): Set SSL at Cloudflare edge (Full/Strict)
#     No local certs needed. Cloudflare handles TLS termination.
#     Set `listen 443 ssl http2` and point to origin pull certs from Cloudflare.
#
#   Option B — Let's Encrypt (Certbot): Run certbot for auto TLS
#     sudo certbot --nginx -d yourdomain.com
#     Certs auto-renew via systemd timer.
#
#   Option C — Self-signed (dev only): Generate self-signed cert
#     mkdir -p data/nginx/ssl
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout data/nginx/ssl/privkey.pem \
#       -out data/nginx/ssl/fullchain.pem \
#       -subj "/CN=${DOMAIN}"

upstream degenfeed {
    server degenfeed:3000;
}

upstream ghost {
    server ghost:2368;
}

upstream gotosocial {
    server gotosocial:8080;
}

# ── HTTP → HTTPS redirect (enables TLS) ──────────────────────────────
# Remove this server block if using Cloudflare with "Full" SSL mode
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Certbot (keep if using Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────
# If using Cloudflare with "Full (strict)" mode, un-comment the ssl_*
# lines and point to Cloudflare origin pull certs.
server {
    # Listen on both IPv4 and IPv6
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name _;  # Catches all domains — Caddy alternative

    # ── TLS (Let's Encrypt or Cloudflare) ──────────────────────────
    # With Cloudflare "Flexible" SSL: comment out all ssl_* lines and
    # remove ssl from listen directive. Cloudflare handles TLS upstream.
    #
    # With Let's Encrypt (Certbot):
    #   ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    #
    # With Cloudflare "Full (strict)": download origin pull cert
    #   ssl_certificate     /etc/nginx/ssl/cloudflare.pem;
    #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern TLS config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (uncomment once TLS is verified working)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ── Logging ──────────────────────────────────────────────────
    access_log /var/log/nginx/degenfeed-access.log;
    error_log  /var/log/nginx/degenfeed-error.log warn;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # ── Request size limits ──────────────────────────────────────
    client_max_body_size 20M;
    proxy_request_buffering off;

    # ── Ghost Blog (/articles) ───────────────────────────────────
    location /articles/ {
        proxy_pass http://ghost/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect http://ghost/ /articles/;

        # Strip /articles prefix internally
        rewrite ^/articles/(.*) /$1 break;
    }

    # Ghost admin assets
    location /ghost/ {
        proxy_pass http://ghost;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── GoToSocial (ActivityPub) ────────────────────────────────
    # Well-known endpoints for fediverse discovery
    location /.well-known/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GoToSocial API
    location /api/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth/Auth
    location /auth/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ActivityPub users / inbox / outbox
    location /users/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NodeInfo
    location /nodeinfo/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GoToSocial file/media server
    location /fileserver/ {
        proxy_pass http://gotosocial;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media can be large
        client_max_body_size 50M;
        proxy_request_buffering off;
    }

    # ── DegenFeed Web (everything else) ──────────────────────────
    location / {
        proxy_pass http://degenfeed;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for live streams, real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://degenfeed;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health check endpoint (internal) ─────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
