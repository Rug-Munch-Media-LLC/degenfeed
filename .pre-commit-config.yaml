# ── Pre-commit config (canonical) ───────────────────────────────
# Source of truth: standards/.pre-commit-config.yaml
# Install: pre-commit install

repos:
  # ── Python linting + formatting (ruff) ───────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # ── Python type checking (mypy) ──────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-requests]
        args: ['--ignore-missing-imports']  # works in repos without pyproject.toml
        types: [python]

  # ── Secret scanning (gitleaks) ───────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ── Python security audit (bandit) ───────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: '1.8.3'
    hooks:
      - id: bandit
        # -ll: medium+ only — matches the CI bandit gate. The `exclude`
        # field is REQUIRED (not just -x): pre-commit passes explicit file
        # paths as args and -x does not filter explicit args, so tests/
        # fixtures were scanned and failed the hook (pryscraper audit
        # 2026-09-12). Glob form matches CI: './tests/*,./.venv/*,...'.
        args: ['-r', '-ll', '-x', './tests/*,./.venv/*,./__pycache__/*']
        exclude: ^tests/

  # ── General file-hygiene checks ──────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: forbid-submodules

# ── Global settings ────────────────────────────────────────────
default_language_version:
  python: python3.11

default_install_hook_types: [pre-commit, pre-push]

fail_fast: false
min_version: '4.0.0'

exclude: |
  (?x)^(
    .*\.min\.(js|css)|
    package-lock\.json|
    yarn\.lock|
    pnpm-lock\.yaml|
    .*\.snap
  )$
