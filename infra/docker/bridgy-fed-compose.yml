# bridgy-fed-compose.yml — Bridgy Fed service (FIXED v2)
# Bridges ActivityPub (GotoSocial) ↔ Bluesky/ATProto
# Includes Firestore emulator sidecar for local Datastore.
#
# Bring up: docker compose -f infra/docker/bridgy-fed-compose.yml up -d
# Logs:     docker compose -f infra/docker/bridgy-fed-compose.yml logs -f

services:
  # Google Cloud Firestore emulator (Datastore mode) — required by Bridgy Fed
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: bridgy-firestore-emulator
    hostname: firestore-emulator
    restart: unless-stopped
    command: >
      gcloud beta emulators firestore start
      --host-port=0.0.0.0:8089
      --database-mode=datastore-mode
    ports:
      - "127.0.0.1:8089:8089"
    networks:
      - rmi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bridgy-fed:
    image: bridgy-fed:latest
    build:
      context: ../..
      dockerfile: infra/docker/bridgy-fed.Dockerfile
    container_name: bridgy-fed
    hostname: bridgy-fed
    restart: unless-stopped
    depends_on:
      firestore-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8285:8080"
    volumes:
      - bridgy-fed-data:/data
    environment:
      FLASK_ENV: development
      HOST: bridgy.degenfeed.xyz
      BRIDGY_FED_DATA: /data
      # Firestore emulator connection
      DATASTORE_EMULATOR_HOST: firestore-emulator:8089
      DATASTORE_DATASET: bridgy-federated
      DATASTORE_PROJECT_ID: bridgy-federated
      # ActivityPub
      ACTIVITYPUB_HOST: social.degenfeed.xyz
      # Bluesky
      BSKY_APPVIEW: https://public.api.bsky.app
      BSKY_PDS_HOST: pds.degenfeed.xyz
      BSKY_PLC_HOST: plc.directory
      BSKY_BGS_HOST: bsky.network
      # Nostr
      NOSTR_RELAYS: wss://relay.damus.io,wss://relay.primal.net
      # Farcaster
      FARCASTER_HUB: https://hub.farcaster.standardcrypto.vc:2281
      # Rate limiting via shared Redis
      RATELIMIT_STORAGE_URI: redis://rmi-redis:6379/5
    networks:
      - rmi-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -o /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

volumes:
  bridgy-fed-data:
    name: bridgy-fed-data
    driver: local

networks:
  rmi-net:
    name: rmi-net
    external: true
