# bridgy-fed-compose.yml — Bridgy Fed service for Talos (netcup)
# Bridges ActivityPub (GotoSocial) ↔ Bluesky ↔ Nostr ↔ Farcaster
#
# Network: rmi-net (shared with rmi-infra, degenfeed, GotoSocial)
# Data: named volume bridgy-fed-data for persistent state (OAuth tokens,
#       user mappings, cached protocol objects)
#
# Bring up:
#   docker compose -f infra/docker/bridgy-fed-compose.yml up -d

services:
  bridgy-fed:
    image: bridgy-fed:latest
    build:
      context: ../..
      dockerfile: infra/docker/bridgy-fed.Dockerfile
    container_name: bridgy-fed
    hostname: bridgy-fed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    volumes:
      - bridgy-fed-data:/data
    environment:
      FLASK_ENV: production
      HOST: bridgy.degenfeed.xyz
      BRIDGY_FED_DATA: /data
      # ActivityPub → bridged-protocol delivery (public inbox)
      # GotoSocial at social.degenfeed.xyz publishes here
      ACTIVITYPUB_HOST: social.degenfeed.xyz
      # Bluesky
      BSKY_APPVIEW: https://public.api.bsky.app
      # Nostr
      NOSTR_RELAYS: wss://relay.damus.io,wss://relay.primal.net
      # Farcaster
      FARCASTER_HUB: https://hub.farcaster.standardcrypto.vc:2281
      # Rate limiting — protect the bridge
      RATELIMIT_STORAGE_URI: redis://rmi-redis:6379/5
    networks:
      - rmi-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -s -o /dev/null http://localhost:8080/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

volumes:
  bridgy-fed-data:
    name: bridgy-fed-data
    driver: local

networks:
  rmi-net:
    name: rmi-net
    external: true
