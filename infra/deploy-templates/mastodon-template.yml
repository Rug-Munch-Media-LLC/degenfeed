# ──────────────────────────────────────────────────────
# DegenFeed — Self-Hosted Mastodon Instance
# Generated by DegenFeed Deploy API
# ──────────────────────────────────────────────────────
# Usage:
#   1. Replace all ${DOMAIN} placeholders with your domain
#   2. Set all required environment variables
#   3. docker compose up -d
#   4. Run initial setup: docker compose exec mastodon-web bin/tootctl accounts create admin --email ${ADMIN_EMAIL} --confirmed --role Owner
#   5. Configure your reverse proxy (see nginx snippet below)
#
# Requirements:
#   - Docker + Docker Compose v2
#   - 4 GB RAM minimum, 8 GB recommended
#   - Domain with DNS A record pointing to your server IP
#   - Ports 80 and 443 open
#   - SMTP server for email delivery
# ──────────────────────────────────────────────────────

version: "3.8"

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    volumes:
      - mastodon-postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - mastodon-redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    logging: *default-logging
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: false
    volumes:
      - mastodon-es:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  mastodon-web:
    image: ghcr.io/mastodon/mastodon:v4.3
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DOMAIN}
      WEB_DOMAIN: ${DOMAIN}
      DB_HOST: postgres
      DB_USER: mastodon
      DB_NAME: mastodon
      DB_PASS: ${POSTGRES_PASSWORD:-change_me_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_ENABLED: "true"
      ES_HOST: elasticsearch
      ES_PORT: 9200
      SECRET_KEY_BASE: ${MASTODON_SECRET_KEY}
      OTP_SECRET: ${MASTODON_OTP_SECRET}
      VAPID_PRIVATE_KEY: ${MASTODON_VAPID_PRIVATE}
      VAPID_PUBLIC_KEY: ${MASTODON_VAPID_PUBLIC}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${ADMIN_EMAIL}
      SMTP_AUTH_METHOD: plain
      SMTP_OPENSSL_VERIFY_MODE: none
      SMTP_ENABLE_STARTTLS: auto
      SINGLE_USER_MODE: "false"
      DEFAULT_LOCALE: en
    volumes:
      - mastodon-public:/mastodon/public
      - mastodon-system:/mastodon/config
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.3
    logging: *default-logging
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DOMAIN}
      WEB_DOMAIN: ${DOMAIN}
      DB_HOST: postgres
      DB_USER: mastodon
      DB_NAME: mastodon
      DB_PASS: ${POSTGRES_PASSWORD:-change_me_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_ENABLED: "true"
      ES_HOST: elasticsearch
      ES_PORT: 9200
      SECRET_KEY_BASE: ${MASTODON_SECRET_KEY}
      OTP_SECRET: ${MASTODON_OTP_SECRET}
      VAPID_PRIVATE_KEY: ${MASTODON_VAPID_PRIVATE}
      VAPID_PUBLIC_KEY: ${MASTODON_VAPID_PUBLIC}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_LOGIN: ${SMTP_LOGIN}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_ADDRESS: ${ADMIN_EMAIL}
      SMTP_AUTH_METHOD: plain
      SMTP_OPENSSL_VERIFY_MODE: none
      SMTP_ENABLE_STARTTLS: auto
    volumes:
      - mastodon-public:/mastodon/public
      - mastodon-system:/mastodon/config
    command: bundle exec sidekiq
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mastodon-streaming:
    image: ghcr.io/mastodon/mastodon:v4.3
    logging: *default-logging
    ports:
      - "4000:4000"
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      LOCAL_DOMAIN: ${DOMAIN}
      WEB_DOMAIN: ${DOMAIN}
      DB_HOST: postgres
      DB_USER: mastodon
      DB_NAME: mastodon
      DB_PASS: ${POSTGRES_PASSWORD:-change_me_secure_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: node ./streaming
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mastodon-postgres:
  mastodon-redis:
  mastodon-es:
  mastodon-public:
  mastodon-system:

