# ──────────────────────────────────────────────────────
# DegenFeed — Self-Hosted PeerTube Instance
# Generated by DegenFeed Deploy API
# ──────────────────────────────────────────────────────
# Usage:
#   1. Replace all ${DOMAIN} placeholders with your domain
#   2. Set POSTGRES_PASSWORD and PEERTUBE_SECRET to secure values
#   3. docker compose up -d
#   4. Run initial setup: docker compose exec peertube npm run create-admin
#   5. Configure your reverse proxy (see nginx snippet below)
#
# Requirements:
#   - Docker + Docker Compose v2
#   - 4 GB RAM minimum, 8 GB recommended
#   - 100 GB+ storage for video content
#   - Domain with DNS A record pointing to your server IP
#   - Ports 80 and 443 open
# ──────────────────────────────────────────────────────

version: "3.8"

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: peertube
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    volumes:
      - peertube-postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - peertube-redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  peertube:
    image: chocobozzz/peertube:stable
    logging: *default-logging
    ports:
      - "9000:9000"
    environment:
      - NODE_CONFIG='{"webserver":{"hostname":"${DOMAIN}","port":443,"https":true},"database":{"host":"postgres","port":5432,"name":"peertube","user":"peertube","password":"${POSTGRES_PASSWORD:-change_me_secure_password}"},"redis":{"host":"redis","port":6379},"admin":{"email":"${ADMIN_EMAIL}"},"signup":{"enabled":true,"limit":100},"transcoding":{"enabled":true,"threads":2},"storage":{"videos":"/storage/videos","logs":"/storage/logs","previews":"/storage/previews","thumbnails":"/storage/thumbnails","torrents":"/storage/torrents","captions":"/storage/captions","cache":"/storage/cache"}}'
      - PEERTUBE_WEBSERVER_HOSTNAME=${DOMAIN}
      - PEERTUBE_DB_HOSTNAME=postgres
      - PEERTUBE_DB_USER=peertube
      - PEERTUBE_DB_PASSWORD=${POSTGRES_PASSWORD:-change_me_secure_password}
      - PEERTUBE_DB_SUFFIX=_prod
      - PEERTUBE_REDIS_HOSTNAME=redis
      - PEERTUBE_ADMIN_EMAIL=${ADMIN_EMAIL}
      - PEERTUBE_SIGNUP_ENABLED=true
      - PEERTUBE_SIGNUP_LIMIT=100
    volumes:
      - peertube-storage:/storage
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  peertube-postgres:
  peertube-redis:
  peertube-storage:

