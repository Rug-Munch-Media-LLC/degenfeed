# ──────────────────────────────────────────────────────
# DegenFeed — Self-Hosted Lemmy Instance
# Generated by DegenFeed Deploy API
# ──────────────────────────────────────────────────────
# Usage:
#   1. Replace all ${DOMAIN} placeholders with your domain
#   2. Set POSTGRES_PASSWORD to a secure random value
#   3. docker compose up -d
#   4. Configure your reverse proxy (see nginx snippet below)
#
# Requirements:
#   - Docker + Docker Compose v2
#   - 2 GB RAM minimum, 4 GB recommended
#   - Domain with DNS A record pointing to your server IP
#   - Ports 80 and 443 open
# ──────────────────────────────────────────────────────

version: "3.8"

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "4"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: lemmy
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_secure_password}
    volumes:
      - lemmy-postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy"]
      interval: 10s
      timeout: 5s
      retries: 5

  lemmy:
    image: dessalines/lemmy:0.19
    logging: *default-logging
    ports:
      - "8536:8536"
    environment:
      LEMMY_DATABASE_URL: postgres://lemmy:${POSTGRES_PASSWORD:-change_me_secure_password}@postgres:5432/lemmy
      LEMMY_HOSTNAME: ${DOMAIN}
    volumes:
      - lemmy-pictrs:/mnt/pictrs
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8536/api/v3/site"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  lemmy-ui:
    image: dessalines/lemmy-ui:0.19
    logging: *default-logging
    ports:
      - "1234:1234"
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: lemmy:8536
      LEMMY_UI_LEMMY_EXTERNAL_HOST: ${DOMAIN}
      LEMMY_UI_HOST: 0.0.0.0:1234
    restart: always
    depends_on:
      - lemmy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1234"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  lemmy-postgres:
  lemmy-pictrs:

