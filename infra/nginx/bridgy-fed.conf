# bridgy-fed.conf — Nginx reverse proxy for bridgy.degenfeed.xyz → Bridgy Fed (localhost:8085)
# Deploy to: /etc/nginx/sites-available/bridgy-fed.conf → symlink to sites-enabled/
# Certbot: certbot --nginx -d bridgy.degenfeed.xyz
#
# Bridgy Fed handles ActivityPub ↔ Bluesky ↔ Nostr ↔ Farcaster message routing.
# This is an internal bridge — only GotoSocial and the DegenFeed worker talk to it.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=bridgy_fed:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=bridgy_fed_burst:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=bridgy_fed_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name bridgy.degenfeed.xyz;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bridgy.degenfeed.xyz;

    # SSL (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/bridgy.degenfeed.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridgy.degenfeed.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bridgy.degenfeed.xyz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Limit request body (ActivityPub messages are small)
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # Connection limits
    limit_conn bridgy_fed_conn 20;
    limit_req zone=bridgy_fed burst=10 nodelay;

    # Bridge-specific endpoints — tighter rate limit
    location ~ ^/(webmention|micropub|xmpp|nostr)/ {
        limit_req zone=bridgy_fed burst=5 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Main reverse proxy
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (ActivityPub federation uses streaming in some modes)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Hide backend headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # Health check endpoint (internal, no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:8085;
        access_log off;
        limit_req zone=bridgy_fed burst=2 nodelay;
    }

    # Deny access to internal paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/bridgy-fed.access.log;
    error_log  /var/log/nginx/bridgy-fed.error.log warn;
}
